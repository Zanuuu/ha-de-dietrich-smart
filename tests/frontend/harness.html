<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banc du panneau Chaudière</title>
<style>
  /* Palette par défaut de Home Assistant, claire et sombre (?theme=dark). */
  :root { --primary-color: #03a9f4; --primary-background-color: #fafafa; --card-background-color: #fff;
    --primary-text-color: #212121; --secondary-text-color: #727272; --divider-color: rgba(0,0,0,.12);
    --app-header-background-color: #03a9f4; --app-header-text-color: #fff; --error-color: #db4437;
    --warning-color: #ffa600; --success-color: #43a047; --text-primary-color: #fff; }
  :root.dark { --primary-background-color: #111111; --card-background-color: #1c1c1c; --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b; --divider-color: rgba(225,225,225,.12); --app-header-background-color: #101e24;
    --app-header-text-color: #e1e1e1; }
  body { margin: 0; background: var(--primary-background-color); }
</style>
</head>
<body>
<script type="module">
  // Faux objet hass : callWS répond avec des données proches de l'installation réelle.
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'dark') document.documentElement.classList.add('dark');
  const week = (rows) => rows.flatMap(([days, t, a]) => days.map((day) => ({ day, time: t, activity: a, setpoint: null })));
  const WD = [1, 2, 3, 4, 5], WE = [0, 6];
  const p2 = week([[WD, '06:00', 4], [WD, '08:30', 3], [WD, '17:00', 5], [WD, '22:00', 1], [WE, '08:00', 2], [WE, '22:30', 1]]);
  const p1 = week([[[...WD, ...WE], '06:30', 2], [[...WD, ...WE], '22:00', 1]]);
  const dhwWeek = [...WD, ...WE].flatMap((day) => [{ day, time: '06:00', comfort: true }, { day, time: '22:00', comfort: false }]);
  const activities = [[1, 'Nuit', 18], [2, 'Maison', 19], [3, 'Absent', 16], [4, 'Matin', 19], [5, 'Soir', 19]]
    .map(([n, name, setpoint]) => ({ n, name, setpoint, min: 5, max: 30, step: 0.5 }));
  const now = Date.now() / 1000;
  const overview = { entries: [{ entry_id: 'e1', title: 'EMC-S 24/28 MI', undo: { command_id: 12, undo_until: now + 90, undo_remaining: 90, action: 'activite' },
    state: { appliances: [{ id: 'a1', name: 'EMC-S 24/28 MI',
      zones: [{ id: 'z1', name: 'Séjour', program: 2, programs: [1, 2, 3], mode: 'schedule', setpoint: 19, room_temp: 19.5,
        week: { 1: p1, 2: p2, 3: [] }, activities }],
      dhw: [{ id: 'h1', name: 'Eau chaude', mode: 'eco', comfort_setpoint: 50, reduced_setpoint: 15, week: dhwWeek }] }] } }] };
  const ev = (m, kind, level, ago, origin) => ({ id: Math.round(ago), ts: now - ago, kind, level, message: m, data: origin ? { origin } : {} });
  const journal = {
    events: [ev('Consigne : 19 °C → 19,5 °C', 'consigne', 'info', 300, 'Home Assistant'),
      ev('Température ambiante de nouveau transmise : 20 °C', 'connexion', 'good', 3600),
      ev('Température ambiante plus transmise par le cloud', 'connexion', 'warning', 7200),
      ev('Programme 2 modifié : lundi, mardi, mercredi, jeudi, vendredi', 'programme', 'info', 86400, 'thermostat ou appli De Dietrich'),
      ev('Pression basse : 0,9 bar', 'pression', 'warning', 172800)],
    commands: [{ id: 12, ts: now - 30, action: 'activite', params: { activity: 1, setpoint: 17.5, name: 'Nuit' }, ok: true, origin: 'Home Assistant', undone: false },
      { id: 11, ts: now - 4000, action: 'consigne', params: { setpoint: 19.5, duration: 'next' }, ok: true, origin: 'Home Assistant', undone: false },
      { id: 10, ts: now - 9000, action: 'programme', params: { program: 3 }, ok: false, error: 'HTTP 500', origin: 'Home Assistant', undone: false }] };
  // ?case=switch : courbe d'origine (radiateurs) sur un plancher direct, bascule proposée.
  const sw = q.get('case') === 'switch';
  const bands = (mild, fresh, cold) => ({
    mild: { label: 'douce (> 8 °C)', hours: 60, occupied: mild[0], gap: mild[1], ratio: mild[2], recovery_h: 1, counted: mild[0] >= 24 },
    fresh: { label: 'fraîche (0 à 8 °C)', hours: 120, occupied: fresh[0], gap: fresh[1], ratio: fresh[2], recovery_h: 2, counted: fresh[0] >= 24 },
    cold: { label: 'froide (< 0 °C)', hours: 6, occupied: cold[0], gap: cold[1], ratio: cold[2], recovery_h: null, counted: cold[0] >= 24 } });
  const curve = {
    curve: { slope: sw ? 1.5 : 0.5, slope_min: 0, slope_max: 4, slope_step: 0.1, base: sw ? 15 : 22, base_min: 15, base_max: 80, base_step: 0.5, max_flow: 80 },
    guard: { active: true, slope: [0.2, 1], base: [15, 35], max_floor_flow: 45, base_temp: -15,
      violation: sw ? 'pente 1,5 hors des bornes du plancher (0,2 à 1) ; départ de 67,5 °C à −15 °C, au-delà de 45 °C' : null },
    now: { outdoor: 6, flow: sw ? 36 : 29 },
    diagnosis: sw
      ? { action: 'switch_to_floor', slope: 0.3, base: 33, confidence: 'high', days: 1.2, bands: bands([10, -0.2, 30], [9, 0.1, 40], [0, null, null]),
        reasons: ['Courbe hors des bornes du plancher : pente 1,5 hors des bornes du plancher (0,2 à 1) ; départ de 67,5 °C à −15 °C, au-delà de 45 °C.',
          "Bascule proposée une seule fois : même départ qu'aujourd'hui vers 5 °C dehors, puis de petits pas."], short_cycles_per_day: null }
      : { action: 'raise_base', slope: 0.5, base: 23, confidence: 'medium', days: 5.5, bands: bands([18, -0.3, 22], [70, -0.8, 41], [4, -1.2, 63]),
        reasons: ['Bande fraîche (0 à 8 °C) : 0,8 °C sous la consigne en moyenne sur 70 h occupées.'], short_cycles_per_day: 1.5 } };
  window.hass = {
    config: { time_zone: 'Europe/Paris' },
    // ?user=guest : compte non administrateur (lecture seule).
    user: { name: 'Julie', is_admin: q.get('user') !== 'guest' },
    callWS: async (msg) => {
      if (msg.type.endsWith('/overview')) return overview;
      if (msg.type.endsWith('/journal')) return journal;
      if (msg.type.endsWith('/curve')) return curve;
      return { command_id: 13, message: 'Programme 2 modifié : lundi', undo_until: now + 120, undo_remaining: 120 };
    },
  };
  await import('../../custom_components/de_dietrich_smart/frontend/dd-smart-panel.js');
  const panel = document.createElement('dd-smart-panel');
  panel.narrow = innerWidth < 870;
  panel.hass = window.hass;
  document.body.append(panel);
</script>
</body>
</html>
